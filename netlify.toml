[build]
  command = "npm run build"
  publish = "dist"

# Kill the duplicate host: send the Netlify subdomain to the canonical domain.
# Only meaningful once www.gulfcoastsilentdisco.com points at Netlify; harmless before that for git deploys, but strip it from manual drop previews.
[[redirects]]
  from = "https://gulf-coast-silent-disco.netlify.app/*"
  to = "https://www.gulfcoastsilentdisco.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # If the Pep (ElevenLabs) widget is added later, extend script-src/connect-src/frame-src for it.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'"
